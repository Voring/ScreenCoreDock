name: Build (roothide)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Diagnostics
        run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
          make --version | head -2
          perl -v | head -2

      - name: Install ldid
        run: |
          brew install ldid || brew install ProcursusTeam/ldid/ldid || true
          which ldid && ldid -v || echo "ldid unavailable (will see if Theos needs it)"

      - name: Set up Theos
        run: |
          set -euo pipefail
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          test -d "$THEOS/makefiles" && echo "makefiles ok"
          test -d "$THEOS/vendor" || true

          # 只取 iOS 16.5 SDK（theos/sdks 仓库很大，用 partial clone）
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git ls-tree -d --name-only HEAD | sort | head -30
          SDK_DIR="$(git ls-tree -d --name-only HEAD | grep -E '^iPhoneOS16\.5' | head -1)"
          test -n "$SDK_DIR" || { echo 'SDK dir not found'; exit 1; }
          echo "SDK_DIR=$SDK_DIR"
          git sparse-checkout set "$SDK_DIR"
          cp -R "$SDK_DIR" "$THEOS/sdks/"
          ls -la "$THEOS/sdks"
          test -f "$THEOS/sdks/$SDK_DIR/SDKSettings.plist" && echo "SDK ok"

      - name: Build (roothide)
        run: |
          set -o pipefail
          export THEOS_PACKAGE_SCHEME=roothide
          make clean 2>&1 | tee build.log || true
          make package FINALPACKAGE=1 2>&1 | tee -a build.log
          ls -lh packages/

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCoreDock-roothide
          path: packages/*.deb
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Dump failure summary
        if: failure()
        run: |
          {
            echo '## Build failed'
            echo '```'
            tail -n 60 build.log 2>/dev/null || echo 'no build.log'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: ScreenCoreDock-*

      - name: Show artifacts
        run: ls -lhR artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^Version:' control | awk '{print $2}')
          TAG="v${VERSION}"
          echo "releasing $TAG"
          ls artifacts/*.deb
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
          gh release upload "$TAG" artifacts/*.deb --clobber
          gh release edit "$TAG" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
