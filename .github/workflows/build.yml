name: Build (roothide)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    # macos-14 已进入淘汰周期，改用 macos-15（arm64）
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Runner probe
        run: |
          set -o pipefail
          {
            echo "stage: probe"
            echo "runner-os: $RUNNER_OS / $RUNNER_ARCH"
            uname -a
            sw_vers || true
          } 2>&1 | tee build.log

      - name: Diagnostics
        run: |
          set -o pipefail
          {
            echo "stage: diagnostics"
            xcodebuild -version || true
            xcrun --sdk iphoneos --show-sdk-version || true
            make --version | head -2
            perl -v | head -2
          } 2>&1 | tee -a build.log

      - name: Show package metadata
        run: |
          set -o pipefail
          {
            echo "stage: metadata"
            grep -E '^(Package|Name|Version|Architecture|Depends):' control || true
          } 2>&1 | tee -a build.log

      - name: Install ldid
        run: |
          set -o pipefail
          {
            echo "stage: ldid"
            brew install ldid || brew install ProcursusTeam/ldid/ldid || true
            which ldid && ldid -v || echo "ldid unavailable"
          } 2>&1 | tee -a build.log

      - name: Set up Theos
        run: |
          set -o pipefail
          {
            echo "stage: theos-setup"
            set -e
            export THEOS="$RUNNER_TEMP/theos"
            echo "THEOS=$THEOS" >> "$GITHUB_ENV"
            git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
            test -d "$THEOS/makefiles"
            git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
            cd /tmp/sdks
            SDK_DIR="$(git ls-tree -d --name-only HEAD | grep -E '^iPhoneOS16\.5' | head -1)"
            test -n "$SDK_DIR"
            echo "SDK_DIR=$SDK_DIR"
            git sparse-checkout set "$SDK_DIR"
            cp -R "$SDK_DIR" "$THEOS/sdks/"
            ls -la "$THEOS/sdks"
          } 2>&1 | tee -a build.log

      - name: Build (roothide)
        run: |
          set -o pipefail
          {
            echo "stage: make-package"
            set -e
            export THEOS_PACKAGE_SCHEME=roothide
            echo "THEOS=$THEOS"
            make clean || true
            make package FINALPACKAGE=1
            ls -lh packages/ || true
          } 2>&1 | tee -a build.log

      - name: Upload deb
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ScreenCoreDock-roothide
          path: packages/*.deb
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

  report:
    name: write ci report
    needs: [ build ]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch build log
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: build-log
          path: /tmp/log

      - name: Compose report
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          set -euo pipefail
          mkdir -p ci
          {
            echo "# CI 构建报告"
            echo
            echo "- workflow: \`$GITHUB_WORKFLOW\`"
            echo "- run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- build result: **$BUILD_RESULT**"
            echo "- generated at: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "## build.log（末尾 500 行）"
            echo
            echo '```log'
            if [ -f /tmp/log/build.log ]; then
              tail -n 500 /tmp/log/build.log
            else
              echo 'build.log 未上传（job 可能在建 log 前就失败，例如 runner 获取失败）'
            fi
            echo '```'
          } > ci/last-build.md
          wc -l ci/last-build.md

      - name: Push report to ci-status branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-status
          git add -f ci/last-build.md
          git commit -m "ci: build report for ${GITHUB_SHA:0:7} [skip ci]" || echo "nothing to commit"
          git push -f origin ci-status

  release:
    needs: build
    if: success() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
          pattern: ScreenCoreDock-*

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(grep -m1 '^Version:' control | awk '{print $2}')
          TAG="v${VERSION}"
          echo "releasing $TAG"
          ls -lh artifacts
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
          gh release upload "$TAG" artifacts/*.deb --clobber
          gh release edit "$TAG" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
