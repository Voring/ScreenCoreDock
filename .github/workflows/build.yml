name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.scheme }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        scheme: [ rootless, roothide ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ldid
        run: |
          brew install ldid || true
          which ldid || echo "ldid not found, will rely on Theos fallback"

      - name: Set up Theos
        run: |
          set -e
          export THEOS="$RUNNER_TEMP/theos"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          git clone --recursive --depth=1 https://github.com/roothide/theos.git "$THEOS"
          mkdir -p "$THEOS/sdks"

          # 只取 iOS 16.5 SDK，避免整包 sdks 仓库
          git clone --depth=1 --filter=blob:none --sparse https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          SDK_DIR=$(git ls-tree -d --name-only HEAD | grep -E 'iPhoneOS16\.5' | head -1)
          echo "SDK_DIR=$SDK_DIR"
          git sparse-checkout set "$SDK_DIR"
          cp -R "$SDK_DIR" "$THEOS/sdks/"
          ls "$THEOS/sdks"

      - name: Build
        run: |
          set -e
          export THEOS_PACKAGE_SCHEME=${{ matrix.scheme }}
          make clean || true
          make package FINALPACKAGE=1
          ls -l packages/

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.scheme }}
          path: packages/*.deb
          if-no-files-found: error

  release:
    name: release
    needs: build
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download debs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Show artifacts
        run: ls -lhR artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          VERSION=$(grep -m1 '^Version:' control | awk '{print $2}')
          TAG="v${VERSION}"
          echo "releasing $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
          gh release upload "$TAG" artifacts/*.deb --clobber
          gh release edit "$TAG" --title "ScreenCoreDock $TAG" --notes-file RELEASE_NOTES.md --latest
          gh release view "$TAG" --json tagName,assets
